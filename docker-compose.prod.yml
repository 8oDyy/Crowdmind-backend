services:
  api_prod:
    container_name: api_prod
    image: ghcr.io/8odyy/crowdmind-backend-api:latest
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      redis_prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2); sys.exit(0)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - crowdmind_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis_prod:
    container_name: redis_prod
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_prod_data:/data
    restart: unless-stopped
    networks:
      - crowdmind_net

volumes:
  redis_prod_data:

networks:
  crowdmind_net:
    external: true
