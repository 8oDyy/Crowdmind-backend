name: CD

on:
  workflow_run:
    workflows: ["CI - Lint, Test & Push to GHCR"]
    types: [completed]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
    # dev -> staging, main -> production
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set deploy variables
        id: vars
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "deploy_path=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.prod.yml" >> $GITHUB_OUTPUT
          else
            echo "deploy_path=${{ secrets.DEPLOY_PATH_STAGING }}" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.staging.yml" >> $GITHUB_OUTPUT
          fi

      - name: Copy compose + bootstrap to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "${{ steps.vars.outputs.compose_file }},infra/bootstrap.sh"
          target: ${{ steps.vars.outputs.deploy_path }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ steps.vars.outputs.deploy_path }}"
            chmod +x infra/bootstrap.sh && ./infra/bootstrap.sh
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            docker compose -f "${{ steps.vars.outputs.compose_file }}" pull
            docker compose -f "${{ steps.vars.outputs.compose_file }}" up -d --force-recreate

            SERVICE=$(docker compose -f "${{ steps.vars.outputs.compose_file }}" config --services | grep '^api' | head -n1)
            for i in $(seq 1 30); do
              if docker compose -f "${{ steps.vars.outputs.compose_file }}" exec -T "$SERVICE" \
                  python -c "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2); sys.exit(0)" 2>/dev/null; then
                echo "API healthy after ${i} attempt(s)"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "API failed to become healthy after 60s"
                docker compose -f "${{ steps.vars.outputs.compose_file }}" logs --tail=100 "$SERVICE"
                exit 1
              fi
              sleep 2
            done

            docker image prune -f
            docker exec crowdmind_nginx nginx -s reload || true
